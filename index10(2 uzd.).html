<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <title>Antraštė su efektu</title>
  <style>

div {
  width: 100px;
  height: 5px;
  background: red;
  transition: transform 1s;
  transition-timing-function: linear;
  margin: 0%;
  padding: -5px;
}

div:hover {
  transform: scaleX(3);
}

block {
    width: 100%;
    height: 100px;
    background: red;
    transition: transform 1s;
    transition-timing-function: linear;
    margin: 0%;
    padding: -5px;
    border: 1px solid black;
}


  </style>
</head>
<body>
  <h2 class="su-efektu">Svarbi antraštė </h2>
 <div> !!!!!</div>
</body>
</html>
